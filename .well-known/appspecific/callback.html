<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Tesla OAuth Callback</title></head>
<body style="font-family:sans-serif;max-width:640px;margin:40px auto;padding:0 16px">
<h2>授权完成</h2>
<p>把下面这一整行地址完整复制，发回给 Muse（里面的一次性 code 有效期很短，请尽快）：</p>
<textarea id="u" readonly style="width:100%;height:120px;font-size:13px"></textarea>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('u').value)" style="font-size:16px;padding:8px 20px">复制地址</button></p>
<script>document.getElementById('u').value = window.location.href;</script>
</body>
</html>
