<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0a0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="晨报" />
<link rel="icon" href="data:," />
<title>晨报仪表盘</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0a0f14;
    --bg2:#0e151d;
    --card:#121c26;
    --card2:#16222f;
    --line:rgba(255,255,255,.08);
    --line2:rgba(255,255,255,.13);
    --text:#f2f5f7;
    --text2:#aebcc8;
    --text3:#7d8f9e;
    --accent:#e8b34b;      /* 暖金，只用于关键数字与今日重点 */
    --teal:#3ec6b8;
    --blue:#5ea8e6;
    --green:#5ec97a;
    --amber:#e8b34b;
    --red:#e8736a;
    --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{
    min-height:100dvh;
    display:grid;
    grid-template-columns: 400px 1fr;
    gap:14px;
    padding:16px;
    max-width:1600px;
    margin:0 auto;
  }

  /* ---------- 左区 ---------- */
  .left{
    background:linear-gradient(180deg,var(--bg2),#0b1219);
    border:1px solid var(--line);
    border-radius:24px;
    padding:22px 26px 16px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .loc{
    display:flex;align-items:center;gap:8px;
    font-size:14px;letter-spacing:.12em;color:var(--text3);font-weight:600;
  }
  .loc i{width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block;flex:none}
  .date-main{
    margin-top:12px;
    font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1.25;
  }
  .date-sub{margin-top:3px;font-size:14.5px;color:var(--text2);line-height:1.5}
  .clock{
    margin-top:4px;
    display:flex;align-items:baseline;gap:10px;
    font-variant-numeric:tabular-nums;
    line-height:.95;
  }
  .clock-hm{
    font-size:clamp(84px,8.8vw,118px);
    font-weight:200;letter-spacing:-.03em;
  }
  .clock-sec{
    font-size:34px;font-weight:300;color:var(--accent);
    font-variant-numeric:tabular-nums;min-width:52px;
  }
  .clock-ampm{font-size:15px;color:var(--text3);font-weight:600;letter-spacing:.08em}
  .divider{height:1px;background:var(--line);margin:16px 0}

  /* 天气 */
  .weather-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .weather-label{font-size:13px;letter-spacing:.14em;color:var(--text3);font-weight:700}
  .weather-updated{font-size:12px;color:var(--text3)}
  .weather-main{display:flex;align-items:flex-start;gap:16px;margin-top:12px}
  .w-temp{font-size:76px;line-height:.9;font-weight:200;font-variant-numeric:tabular-nums}
  .w-temp sup{font-size:28px;color:var(--text2);font-weight:300}
  .w-cond{font-size:20px;font-weight:600;margin-top:8px}
  .w-range{font-size:15px;color:var(--text2);margin-top:4px;font-variant-numeric:tabular-nums}
  .w-range b{color:var(--text);font-weight:600}
  .w-note{font-size:13px;color:var(--text3);line-height:1.6;margin-top:10px}
  .w-pending{
    margin-top:14px;padding:16px;border:1px dashed var(--line2);border-radius:14px;
    color:var(--text2);font-size:16px;
  }

  /* 未来三天 */
  .fc{margin-top:12px;display:flex;flex-direction:column;gap:10px}
  .fc-row{display:grid;grid-template-columns:88px 40px 1fr auto;align-items:center;gap:10px;font-size:14px}
  .fc-d{color:var(--text2);font-weight:600;font-size:13.5px;white-space:nowrap}
  .fc-c{font-weight:600;white-space:nowrap}
  .fc-bar{position:relative;height:5px;border-radius:99px;background:rgba(255,255,255,.08)}
  .fc-bar > i{position:absolute;top:0;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--amber))}
  .fc-t{font-variant-numeric:tabular-nums;color:var(--text2);white-space:nowrap}
  .fc-t b{color:var(--text)}
  .left-foot{margin-top:auto;padding-top:18px}
  .wake-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .wake-btn{
    appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--text);
    padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .wake-btn[aria-pressed="true"]{border-color:rgba(62,198,184,.5);color:var(--teal)}
  .foot-note{font-size:12px;color:var(--text3);line-height:1.6;margin-top:10px}

  /* ---------- 右区 ---------- */
  .right{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:14px;
    min-height:0;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px 14px;
    display:flex;flex-direction:column;
    min-width:0;
    overflow:hidden;
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .card-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:.02em}
  .card-title .ic{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
    background:var(--card2);border:1px solid var(--line);
  }
  .card-title .ic svg{width:19px;height:19px}
  .badge{
    font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;
    border:1px solid var(--line2);color:var(--text2);background:rgba(255,255,255,.03);
  }
  .badge.warn{color:var(--amber);border-color:rgba(232,179,75,.35)}
  .badge.ok{color:var(--green);border-color:rgba(94,201,122,.35)}
  .meta{font-size:12.5px;color:var(--text3);margin-top:3px}

  .big-row{display:flex;align-items:baseline;gap:14px;margin-top:12px;flex-wrap:wrap}
  .big-num{font-size:48px;line-height:1;font-weight:250;font-variant-numeric:tabular-nums}
  .big-num small{font-size:22px;color:var(--text2);font-weight:400}
  .big-side{font-size:15px;color:var(--text2);line-height:1.5}
  .big-side b{color:var(--text);font-size:18px}

  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
  .bar > i{display:block;height:100%;border-radius:99px;background:var(--teal)}
  .bar.gold > i{background:var(--accent)}
  .bar.blue > i{background:var(--blue)}

  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px}
  .kv{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .kv .k{font-size:12px;color:var(--text3);letter-spacing:.06em;font-weight:600}
  .kv .v{font-size:17px;font-weight:650;margin-top:3px;font-variant-numeric:tabular-nums}
  .kv .v small{font-size:12px;color:var(--text3);font-weight:500}

  .card-note{padding-top:10px;font-size:13.5px;color:var(--text2);line-height:1.6;border-top:1px solid var(--line);margin-top:12px}
  .tesla-note,.goal-note{margin-top:auto}

  /* 睡眠分段 */
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .seg-item{border-top:3px solid var(--line2);padding-top:8px}
  .seg-item.deep{border-color:var(--blue)}
  .seg-item.rem{border-color:#9a7fe0}
  .seg-item.eff{border-color:var(--teal)}
  .seg-item .k{font-size:12px;color:var(--text3);font-weight:600;letter-spacing:.05em}
  .seg-item .v{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .trend{font-size:12px;font-weight:700}
  .trend.up{color:var(--green)} .trend.down{color:var(--red)} .trend.flat{color:var(--text3)}

  /* 今日事项 */
  .todo{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:0}
  .todo li{
    display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start;
  }
  .todo li:last-child{border-bottom:none}
  .todo .dot{
    width:22px;height:22px;border-radius:7px;flex:none;margin-top:1px;
    border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;color:var(--text3);font-weight:800;
    background:rgba(255,255,255,.02);
  }
  .todo .t{font-size:15.5px;line-height:1.5;font-weight:550}
  .todo .t small{display:block;font-size:13px;color:var(--text3);font-weight:400;margin-top:1px;line-height:1.5}
  .focus{
    margin-top:auto;background:rgba(232,179,75,.09);border:1px solid rgba(232,179,75,.32);
    border-radius:14px;padding:11px 15px;
  }
  .focus .k{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:800}
  .focus .v{font-size:19px;font-weight:750;margin-top:2px}

  /* 目标 */
  .goal-compare{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-top:6px;font-variant-numeric:tabular-nums}
  .goal-compare b{color:var(--text)}
  .goal-list{margin-top:10px;display:flex;flex-direction:column;gap:9px}
  .goal-row{display:flex;justify-content:space-between;gap:14px;font-size:14.5px;padding:7px 0;border-bottom:1px solid var(--line)}
  .goal-row:last-child{border-bottom:none}
  .goal-row .k{color:var(--text2)}
  .goal-row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .goal-row .v small{display:block;font-weight:400;color:var(--text3);font-size:12px;margin-top:1px}

  @media (max-width: 980px){
    .wrap{grid-template-columns:1fr;padding:14px;gap:14px}
    .right{grid-template-columns:1fr;grid-template-rows:none}
    .clock-hm{font-size:clamp(72px,18vw,110px)}
    .left{min-height:auto}
  }
  @media (min-width:981px) and (max-height:820px){
    .clock-hm{font-size:96px}
    .w-temp{font-size:60px}
    .big-num{font-size:44px}
    .card{padding:18px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 左区 -->
  <aside class="left" aria-label="时钟与天气">
    <div class="loc"><i></i> 厦门 · 同安</div>
    <div class="date-main" id="dateMain">—</div>

        <p class="w-note">无台风/暴雨预警。东北风 24km/h、阵风 42km/h；新冷空气已到，比前几天凉约 3°C，早晚加件外套。</p>
      </div>
    </section>

    <div class="divider"></div>

    <section aria-label="未来三天">
      <div class="weather-head">
        <span class="weather-label">未来三天</span>

      </div>
      <p class="foot-note">天气随每日晨报同步更新<br>晨报内容每日更新，见右侧四张卡</p>
    </div>
  </aside>

  <!-- 右区：内容全部由下方 BRIEFING 渲染 -->
  <main class="right" id="cards" aria-label="晨报"></main>
</div>

<script>
/* ============================================================
   BRIEFING —— 每日晨报数据（唯一数据源，每天只改这一块）
   2026-11-06 晨发布，面向 2026-11-06

    deep: "1 小时 22 分",

    note: "健康数据已于 11-06 08:32 同步：00:24 入睡、07:14 起床，实睡 6 小时 01 分，夜间醒来 21 次。基线 HRV 29.6 ms、静息心率 85 bpm。"
  },
  today: {
    title: "今日事项",
    dateLabel: "11-06 周五",
    status: "病假休息日",
    statusType: "",
    items: [
      { t: "病假休息", s: "Google 日历今日 0 事件" },
      { t: "Konami SR49 时间评估回复", s: "今天到期" },
      { t: "CIM 光英 Chroma standby 人选", s: "11-15 厂商 standby · 今天给" },
      { t: "成长时间", s: "今晚 20:10" },
      { t: "母亲 CGM 换新探头", s: "明天 11-07" },
      { t: "中信还款约 ¥33,052", s: "后天 11-08" }
    ],
    focusLabel: "今日最重要一件事",
    focus: "把今天到期的两份回复定下来——Konami SR49 时间评估回复、Chroma standby 人选，确认或明确交给晓威"
  },
  goal: {
    title: "目标进度",
    status: "按计划运行",
    statusType: "ok",
    baselineLabel: "五年还债 · 总约 ¥655,000 · 目标 2030 上半年清零",
    ladderLabel: "11 月账单梯队合计",
    ladderTotal: 114932.89,
    ladder: [
      { d: "11-08", k: "中信", v: "¥33,052" },

    ],

/* ---------------- 图标（内联 SVG） ---------------- */
function iconCar(){return '<svg viewBox="0 0 24 24" fill="none" stroke="#5ea8e6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l1.4-5.2A2 2 0 0 1 8.3 9.3h7.4a2 2 0 0 1 1.9 1.5L19 16"/><path d="M3.5 16.5h17v3h-17z"/><circle cx="7.2" cy="19.5" r="1.4"/><circle cx="16.8" cy="19.5" r="1.4"/></svg>';}
function iconMoon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="#9a7fe0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.2A8.5 8.5 0 1 1 10.8 4a7 7 0 0 0 9.2 9.2z"/></svg>';}
function iconList(){return '<svg viewBox="0 0 24 24" fill="none" stroke="#e8b34b" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M3.8 6h.01M3.8 12h.01M3.8 18h.01" stroke-width="2.6"/></svg>';}
function iconTarget(){return '<svg viewBox="0 0 24 24" fill="none" stroke="#3ec6b8" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="#3ec6b8"/></svg>';}
function fmtYen(n){return "¥" + n.toLocaleString("zh-CN");}
function badge(text,type){ if(!text) return ""; return '<span class="badge '+(type||"")+'">'+text+'</span>'; }
function trendHtml(cur, avg, invert){
  var d = Math.round((cur-avg)*10)/10;
  if (d===0) return '<span class="trend flat">与均值持平</span>';
  var up = d>0;
  var good = invert ? !up : up;
  return '<span class="trend '+(good?"up":"down")+'">'+(up?"↑":"↓")+" "+Math.abs(d)+'</span>';
}

/* ---------------- 渲染四张卡 ---------------- */
(function render(){
  var B = BRIEFING, T=B.tesla, S=B.sleep, D=B.today, G=B.goal;
  var spendPct = Math.min(100, Math.round(G.spend / G.spendBaseline * 100));

  var html = ""
  /* 特斯拉 */
  + '<section class="card" aria-label="特斯拉">'
  +   '<div class="card-head"><div><div class="card-title"><span class="ic">'+iconCar()+'</span>'+T.title+'</div><div class="meta">'+T.measuredAt+'</div></div>'+badge(T.status,T.statusType)+'</div>'
  +   (T.batteryPct==null
      ? '<div class="big-row"><div class="big-num" style="font-size:38px">待同步</div><div class="big-side">深睡离线<br>最近在线 11-05 07:23</div></div>'
        + '<div class="bar"><i style="width:0%"></i></div>'
      : '<div class="big-row"><div class="big-num">'+T.batteryPct+'<small> %</small></div><div class="big-side">续航 <b>'+T.rangeKm+' km</b></div></div>'
        + '<div class="bar"><i style="width:'+T.batteryPct+'%"></i></div>')
  +   '<div class="kv-grid">'
  +     '<div class="kv"><div class="k">胎压</div><div class="v">'+T.tyreBar+'</div></div>'
  +     '<div class="kv"><div class="k">状态</div><div class="v">'+T.state+'</div></div>'
  +     '<div class="kv"><div class="k">充电上限</div><div class="v">'+(T.chargeLimit||"—")+'</div></div>'
  +     '<div class="kv"><div class="k">哨兵模式</div><div class="v">'+(T.sentry||"—")+'</div></div>'
  +     '<div class="kv"><div class="k">车内温度</div><div class="v">'+(T.cabinTemp||"—")+'</div></div>'
  +     '<div class="kv"><div class="k">车外温度</div><div class="v">'+(T.outsideTemp||"—")+'</div></div>'
  +   '</div>'
  +   '<p class="card-note tesla-note">'+T.note+'</p>'
  + '</section>'

  /* 睡眠 */
  + '<section class="card" aria-label="昨夜睡眠">'
  +   '<div class="card-head"><div><div class="card-title"><span class="ic">'+iconMoon()+'</span>'+S.title+'</div><div class="meta">'+S.nightLabel+'</div></div>'+badge(S.status,S.statusType)+'</div>'
  +   '<div class="big-row"><div class="big-num" style="font-size:42px">'+S.total+'</div></div>'
  +   '<div class="seg">'
  +     '<div class="seg-item deep"><div class="k">深睡</div><div class="v">'+S.deep+'</div></div>'
  +     '<div class="seg-item rem"><div class="k">REM</div><div class="v">'+S.rem+'</div></div>'
  +     '<div class="seg-item eff"><div class="k">睡眠效率</div><div class="v">'+S.efficiency+'</div></div>'
  +   '</div>'
  +   '<div class="kv-grid">'
  +     '<div class="kv"><div class="k">HRV</div><div class="v">'+S.hrv.toFixed(1)+' <small>'+S.hrvUnit+' · 7日均 '+S.hrvAvg7+'</small></div><div style="margin-top:3px">'+trendHtml(S.hrv,S.hrvAvg7,false)+'</div></div>'
  +     '<div class="kv"><div class="k">静息心率</div><div class="v">'+S.rhr+' <small>'+S.rhrUnit+' · 7日均 '+S.rhrAvg7+'</small></div><div style="margin-top:3px">'+trendHtml(S.rhr,S.rhrAvg7,true)+'</div></div>'
  +   '</div>'
  +   '<p class="card-note">'+S.note+'</p>'
  + '</section>'

  /* 今日事项 */
  + '<section class="card" aria-label="今日事项">'
  +   '<div class="card-head"><div><div class="card-title"><span class="ic">'+iconList()+'</span>'+D.title+'</div><div class="meta">'+D.dateLabel+'</div></div>'+badge(D.status,D.statusType)+'</div>'
  +   '<ul class="todo">'
  +     D.items.map(function(it,i){ return '<li><span class="dot">'+(i+1)+'</span><span class="t">'+it.t+(it.s?'<small>'+it.s+'</small>':'')+'</span></li>'; }).join("")
  +   '</ul>'
  +   '<div class="focus"><div class="k">'+D.focusLabel+'</div><div class="v">'+D.focus+'</div></div>'
  + '</section>'

  /* 目标进度 */
  + '<section class="card" aria-label="目标进度">'
  +   '<div class="card-head"><div><div class="card-title"><span class="ic">'+iconTarget()+'</span>'+G.title+'</div><div class="meta">'+G.baselineLabel+'</div></div>'+badge(G.status,G.statusType)+'</div>'
  +   '<div class="big-row"><div class="big-num" style="font-size:40px">'+fmtYen(G.ladderTotal)+'</div><div class="big-side">'+G.ladderLabel+'</div></div>'
  +   '<div class="goal-list">'
  +     G.ladder.map(function(r){ return '<div class="goal-row"><span class="k">'+r.d+' · '+r.k+'</span><span class="v">'+r.v+'</span></div>'; }).join("")
  +   '</div>'
  +   '<div class="bar blue" style="margin-top:14px"><i style="width:'+spendPct+'%"></i></div>'
  +   '<div class="goal-compare"><span>'+G.spendLabel+' <b>'+fmtYen(G.spend)+'</b></span><span>必要基线 <b>'+fmtYen(G.spendBaseline)+'</b></span></div>'
  +   '<p class="card-note goal-note">'+G.note+'</p>'
  + '</section>';

  document.getElementById("cards").innerHTML = html;
})();

/* ---------------- 时钟与日期 ---------------- */
var WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
function pad(n){return (n<10?"0":"")+n;}
function tick(){
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
  document.getElementById("clockHM").textContent = pad(h)+":"+pad(m);
  document.getElementById("clockSec").textContent = pad(s);
  document.getElementById("clockAmpm").textContent = h < 12 ? "上午" : (h < 18 ? "下午" : "晚上");
  document.getElementById("dateMain").textContent =
    now.getFullYear()+" 年 "+(now.getMonth()+1)+" 月 "+now.getDate()+" 日 · "+WEEK[now.getDay()];
  document.getElementById("dateSub").textContent = "晨报面向 "+BRIEFING.dateLabel+" —— 先看右侧，手机不用掏。";
}
tick(); setInterval(tick, 1000);

/* ---------------- 天气：读 BRIEFING，随每日晨报同步 ---------------- */
(function renderWeather(){
  var W = BRIEFING.weather;
  if (!W) return;
  document.getElementById("weatherBody").innerHTML =
    '<div class="weather-main"><div class="w-temp">'+W.hi+'<sup>°C</sup></div>'
    + '<div><div class="w-cond">'+W.condition+'</div>'
    + '<div class="w-range">今日 <b>'+W.lo+'°</b> — <b>'+W.hi+'°</b></div></div></div>'
    + '<p class="w-note">'+W.note+'</p>';
  document.getElementById("wUpdated").textContent = "随晨报更新";
})();

/* ---------------- 未来三天：读 BRIEFING.forecast ---------------- */
(function renderForecast(){
  var F = BRIEFING.forecast;
  if (!F || !F.length) return;
  var MIN = 10, MAX = 32;
  document.getElementById("forecastBody").innerHTML = '<div class="fc">' + F.map(function(x){
    var l = Math.round((x.lo - MIN) / (MAX - MIN) * 100);
    var w = Math.max(6, Math.round((x.hi - x.lo) / (MAX - MIN) * 100));
    return '<div class="fc-row"><span class="fc-d">' + x.d + '</span><span class="fc-c">' + x.c + '</span>'
      + '<span class="fc-bar"><i style="left:' + l + '%;width:' + w + '%"></i></span>'
      + '<span class="fc-t">' + x.lo + '° — <b>' + x.hi + '°</b></span></div>';
  }).join("") + '</div>';
  if (BRIEFING.forecastNote) document.getElementById("forecastNote").textContent = BRIEFING.forecastNote;
})();

/* ---------------- 屏幕常亮（Wake Lock） ---------------- */
var wakeLock = null, wakeBtn = document.getElementById("wakeBtn"), wakeNote = document.getElementById("wakeNote");
function setWakeUI(on){
  wakeBtn.setAttribute("aria-pressed", on ? "true" : "false");
  wakeBtn.textContent = on ? "常亮已开" : "保持屏幕常亮";
  wakeNote.textContent = on ? "屏幕不会自动熄灭，插着电用" : "立在桌上时点一下，防自动锁屏";
}
if ("wakeLock" in navigator) {
  wakeBtn.addEventListener("click", function(){
    if (wakeLock) { wakeLock.release(); return; }
    navigator.wakeLock.request("screen").then(function(wl){
      wakeLock = wl; setWakeUI(true);
      wl.addEventListener("release", function(){ wakeLock = null; setWakeUI(false); });
    }).catch(function(){ wakeNote.textContent = "此浏览器不支持常亮，请在设置里把自动锁定改「永不」"; });
  });
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && wakeLock === null && wakeBtn.getAttribute("aria-pressed")==="true") {
      navigator.wakeLock.request("screen").then(function(wl){ wakeLock = wl; }).catch(function(){});
    }
  });
} else {
  wakeBtn.addEventListener("click", function(){
    wakeNote.textContent = "Safari 不支持网页常亮：设置 → 显示与亮度 → 自动锁定改「永不」即可";
  });
}
</script>
